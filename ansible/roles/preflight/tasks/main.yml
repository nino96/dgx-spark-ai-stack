---
- name: Read DMI system vendor
  ansible.builtin.command: cat /sys/class/dmi/id/sys_vendor
  register: dmi_vendor
  changed_when: false

- name: Read DMI product name
  ansible.builtin.command: cat /sys/class/dmi/id/product_name
  register: dmi_product
  changed_when: false

- name: Check DGX release marker
  ansible.builtin.stat:
    path: /etc/dgx-release
  register: dgx_release_file

- name: Read DGX release marker
  ansible.builtin.slurp:
    path: /etc/dgx-release
  register: dgx_release
  when: dgx_release_file.stat.exists

- name: Read GPU identity and compute capability
  ansible.builtin.command:
    argv:
      - nvidia-smi
      - --query-gpu=name,compute_cap
      - --format=csv,noheader
  register: gpu_identity
  changed_when: false
  failed_when: false

- name: Read CUDA toolkit version
  ansible.builtin.command: nvcc --version
  register: nvcc_version
  changed_when: false
  failed_when: false

- name: Check Docker daemon
  ansible.builtin.command: docker info
  become: true
  register: docker_info
  changed_when: false
  failed_when: false

- name: Check Docker Compose
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false
  failed_when: false

- name: Check NVIDIA Container Toolkit
  ansible.builtin.command: nvidia-ctk --version
  register: nvidia_ctk
  changed_when: false
  failed_when: false

- name: Check free disk under primary home
  ansible.builtin.command:
    argv: [df, --output=avail, -B1, "{{ spark_ai_home }}"]
  register: home_disk
  changed_when: false

- name: Derive host support facts
  ansible.builtin.set_fact:
    spark_ai_is_asus: "{{ 'ASUSTeK' in dmi_vendor.stdout and 'GX10' in dmi_product.stdout }}"
    spark_ai_is_nvidia: "{{ 'NVIDIA' in dmi_vendor.stdout and 'DGX' in dmi_product.stdout and 'Spark' in dmi_product.stdout }}"
    spark_ai_disk_free_bytes: "{{ home_disk.stdout_lines[-1] | trim | int }}"
    spark_ai_dgx_release: "{{ dgx_release.content | default('') | b64decode }}"

- name: Refuse an unsupported vendor platform baseline
  ansible.builtin.assert:
    that:
      - ansible_architecture == 'aarch64'
      - ansible_distribution == 'Ubuntu'
      - ansible_distribution_version is version('24.04', '>=')
      - dgx_release_file.stat.exists
      - "'DGX' in (spark_ai_dgx_release | upper)"
      - spark_ai_is_asus or spark_ai_is_nvidia
      - spark_ai_variant in ['asus_gx10', 'nvidia_dgx_spark']
      - (spark_ai_variant == 'asus_gx10' and spark_ai_is_asus) or (spark_ai_variant == 'nvidia_dgx_spark' and spark_ai_is_nvidia)
      - gpu_identity.rc == 0
      - "'12.1' in gpu_identity.stdout or 'GB10' in gpu_identity.stdout"
      - nvcc_version.rc == 0
      - "'release 13.' in nvcc_version.stdout"
      - ansible_memtotal_mb | int >= 120000
      - spark_ai_disk_free_bytes | int >= 161061273600
      - docker_info.rc == 0
      - compose_version.rc == 0
      - nvidia_ctk.rc == 0
    fail_msg: >-
      Unsupported DGX Spark baseline. This playbook never replaces firmware,
      BIOS, kernel, NVIDIA driver, CUDA, or DGX OS. Recover the ASUS GX10 with
      the ASUS OEM image, or the NVIDIA Founders Edition with NVIDIA media,
      apply vendor OTA updates, and rerun preflight. See docs/RECOVERY.md.
    success_msg: "Vendor DGX OS, GB10/SM121, CUDA 13, memory, disk, and container baseline verified."
