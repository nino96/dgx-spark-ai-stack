---
- name: Install application build and operations packages
  become: true
  ansible.builtin.apt:
    name:
      - build-essential
      - ca-certificates
      - cmake
      - curl
      - git
      - jq
      - libcurl4-openssl-dev
      - libssl-dev
      - ninja-build
      - openssl
      - python3-pip
      - python3-venv
      - ripgrep
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check for Tailscale
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_binary

- name: Install Tailscale repository key
  become: true
  ansible.builtin.get_url:
    url: https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg
    dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
    mode: "0644"
  when: not tailscale_binary.stat.exists

- name: Configure Tailscale stable repository
  become: true
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg] https://pkgs.tailscale.com/stable/ubuntu noble main"
    filename: tailscale
    state: present
  when: not tailscale_binary.stat.exists

- name: Install Tailscale when missing
  become: true
  ansible.builtin.apt:
    name: tailscale
    state: present
    update_cache: true
  when: not tailscale_binary.stat.exists

- name: Ensure primary user can use Docker
  become: true
  ansible.builtin.user:
    name: "{{ spark_ai_user }}"
    groups: docker
    append: true

- name: Create runtime data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ spark_ai_user }}"
    mode: "0755"
  loop:
    - "{{ spark_ai_data_root }}"
    - "{{ spark_ai_data_root }}/models/gguf"
    - "{{ spark_ai_data_root }}/huggingface"
    - "{{ spark_ai_data_root }}/src"
    - "{{ spark_ai_data_root }}/builds"
    - "{{ spark_ai_data_root }}/cache/searxng"
    - "{{ spark_ai_data_root }}/state"
    - "{{ spark_ai_data_root }}/tools"
    - "{{ spark_ai_home }}/.config/spark-ai-stack"
    - "{{ spark_ai_home }}/.config/systemd/user"

- name: Install pinned Hugging Face CLI environment
  ansible.builtin.pip:
    name: huggingface_hub==0.36.0
    virtualenv: "{{ spark_ai_data_root }}/tools/hf"
    virtualenv_command: /usr/bin/python3 -m venv
    state: present

- name: Create directory for pinned verification keys
  become: true
  ansible.builtin.file:
    path: /usr/local/share/spark-ai-stack
    state: directory
    mode: "0755"

- name: Install LiteLLM public key from its immutable introducing commit
  become: true
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/BerriAI/litellm/0112e53046018d726492c814b3644b7d376029d0/cosign.pub
    dest: /usr/local/share/spark-ai-stack/litellm-cosign.pub
    checksum: sha256:ff8869bf14ba9d10af7b64b9d479543b44daec0165e715753c43ff8a998f6dd3
    mode: "0644"

- name: Install checksum-pinned Cosign ARM64 binary
  become: true
  ansible.builtin.get_url:
    url: https://github.com/sigstore/cosign/releases/download/v3.0.6/cosign-linux-arm64
    dest: /usr/local/bin/cosign
    checksum: sha256:bedac92e8c3729864e13d4a17048007cfafa79d5deca993a43a90ffe018ef2b8
    mode: "0755"

- name: Check user linger
  ansible.builtin.stat:
    path: "/var/lib/systemd/linger/{{ spark_ai_user }}"
  register: linger_file

- name: Enable user services before interactive login
  become: true
  ansible.builtin.command:
    argv: [loginctl, enable-linger, "{{ spark_ai_user }}"]
  when: not linger_file.stat.exists
