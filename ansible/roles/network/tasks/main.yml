---
- name: Check Tailscale daemon
  ansible.builtin.command: tailscale status
  register: tailscale_status
  changed_when: false
  failed_when: false

- name: Require an interactive Tailscale enrollment
  ansible.builtin.assert:
    that:
      - tailscale_status.rc == 0
    fail_msg: >-
      Tailscale is installed but this node is not joined. Run sudo tailscale up
      interactively; no auth key is stored by this repository.

- name: Explain the explicit Serve step
  ansible.builtin.debug:
    msg: "Run bin/stack tailscale-configure after loopback API and search checks pass."
