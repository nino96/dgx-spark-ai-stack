---
- name: Check out locked DS4 source
  ansible.builtin.git:
    repo: https://github.com/Entrpi/ds4.git
    dest: "{{ spark_ai_data_root }}/src/ds4"
    version: 82d2a6f7ec580d979f8352d3249ad5415a321e89
    update: true
    force: false

- name: Read DS4 build stamp
  ansible.builtin.slurp:
    path: "{{ spark_ai_data_root }}/src/ds4/.spark-ai-build-commit"
  register: ds4_stamp
  failed_when: false

- name: Clean DS4 before a new locked build
  ansible.builtin.command: make clean
  args:
    chdir: "{{ spark_ai_data_root }}/src/ds4"
  when: ds4_stamp.content | default('') | b64decode | trim != '82d2a6f7ec580d979f8352d3249ad5415a321e89'

- name: Build DS4 for GB10 SM121
  ansible.builtin.command:
    argv:
      - make
      - cuda-spark
      - "-j{{ ansible_processor_vcpus | default(8) }}"
  args:
    chdir: "{{ spark_ai_data_root }}/src/ds4"
  when: ds4_stamp.content | default('') | b64decode | trim != '82d2a6f7ec580d979f8352d3249ad5415a321e89'

- name: Stamp the DS4 build
  ansible.builtin.copy:
    content: "82d2a6f7ec580d979f8352d3249ad5415a321e89\n"
    dest: "{{ spark_ai_data_root }}/src/ds4/.spark-ai-build-commit"
    mode: "0644"
  when: ds4_stamp.content | default('') | b64decode | trim != '82d2a6f7ec580d979f8352d3249ad5415a321e89'

- name: Check out locked llama.cpp source
  ansible.builtin.git:
    repo: https://github.com/ggml-org/llama.cpp.git
    dest: "{{ spark_ai_data_root }}/src/llama.cpp"
    version: f9e832c10e9444cb168ddcb579cc62c154f3068b
    update: true
    force: false

- name: Check locked llama.cpp build
  ansible.builtin.stat:
    path: "{{ spark_ai_data_root }}/builds/llama.cpp-f9e832c10e9444cb168ddcb579cc62c154f3068b/bin/llama-server"
  register: llama_server_binary

- name: Configure llama.cpp CUDA SM121 build
  ansible.builtin.command:
    argv:
      - cmake
      - -S
      - "{{ spark_ai_data_root }}/src/llama.cpp"
      - -B
      - "{{ spark_ai_data_root }}/builds/llama.cpp-f9e832c10e9444cb168ddcb579cc62c154f3068b"
      - -G
      - Ninja
      - -DGGML_CUDA=ON
      - -DGGML_CUDA_FA_ALL_QUANTS=ON
      - -DCMAKE_CUDA_ARCHITECTURES=121
      - -DCMAKE_BUILD_TYPE=Release
  when: not llama_server_binary.stat.exists

- name: Build llama.cpp server
  ansible.builtin.command:
    argv:
      - cmake
      - --build
      - "{{ spark_ai_data_root }}/builds/llama.cpp-f9e832c10e9444cb168ddcb579cc62c154f3068b"
      - --target
      - llama-server
      - --parallel
      - "{{ ansible_processor_vcpus | default(8) }}"
  when: not llama_server_binary.stat.exists

- name: Point stable llama.cpp build path at locked build
  ansible.builtin.file:
    src: "{{ spark_ai_data_root }}/builds/llama.cpp-f9e832c10e9444cb168ddcb579cc62c154f3068b"
    dest: "{{ spark_ai_data_root }}/builds/llama.cpp"
    state: link
    force: true
