name: spark-ai-dns

services:
  pihole:
    profiles: [pihole]
    image: docker.io/pihole/pihole:2026.07.2@sha256:a29ad980775f38a8e7524a206ff9c125bc6fcfd9de8de1fc93d2de0671cc1d34
    container_name: spark-ai-pihole
    restart: unless-stopped
    environment:
      TZ: ${DNS_TIMEZONE}
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: ALL
    ports:
      - "${DNS_LAN_IP}:53:53/tcp"
      - "${DNS_LAN_IP}:53:53/udp"
      - "${DNS_TAILSCALE_IP}:53:53/tcp"
      - "${DNS_TAILSCALE_IP}:53:53/udp"
      - "127.0.0.1:8088:80/tcp"
    volumes:
      - ${SPARK_AI_DATA_ROOT:-${HOME}/ai-data}/dns/pihole:/etc/pihole
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  adguard:
    profiles: [adguard]
    image: docker.io/adguard/adguardhome:v0.107.76@sha256:bd12e2cd483737b6b51a056bc5cc5d5d544b94f14a7aae93ce2f83943760f2ce
    container_name: spark-ai-adguard
    restart: unless-stopped
    ports:
      - "${DNS_LAN_IP}:53:53/tcp"
      - "${DNS_LAN_IP}:53:53/udp"
      - "${DNS_TAILSCALE_IP}:53:53/tcp"
      - "${DNS_TAILSCALE_IP}:53:53/udp"
      - "127.0.0.1:8089:80/tcp"
      - "127.0.0.1:8090:3000/tcp"
    volumes:
      - ${SPARK_AI_DATA_ROOT:-${HOME}/ai-data}/dns/adguard/work:/opt/adguardhome/work
      - ${SPARK_AI_DATA_ROOT:-${HOME}/ai-data}/dns/adguard/conf:/opt/adguardhome/conf
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
