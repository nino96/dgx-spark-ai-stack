# Image + source pin lockfile for spark-ai-stack.
#
# Pin/bump procedure (one line): edit the pin here, rebuild the affected image (or
# `docker pull` for an upstream-only pin), run the sanity + acceptance suite, then
# commit this file alongside whatever change required the bump.
#
# Rewritten from the old schema-1 JSON-in-YAML lockfile as real YAML. Everything
# ansible/cosign-related has been dropped (no ansible or image-signature verification
# in the refactored stack). `digest: null` means "pin on first pull" — either the old
# lockfile never recorded a digest for this artifact, or this repo moved to a newer
# tag than the old lockfile pinned.

schema_version: 2

images:
  litellm:
    repository: ghcr.io/berriai/litellm
    tag: v1.86.2
    digest: sha256:c0fded5fc397836c9f75220f3a3cacf8dca1525be8b474b068233afd3fe6e8f1
    platform: linux/arm64
    notes: >
      Carried from the schema-1 lockfile — still the pin used by compose/compose.yml's
      litellm service. Bump by choosing a newer released version at implementation
      time (docs/CONTRACTS.md §4 leaves the version choice open).

  vllm_base:
    repository: nvcr.io/nvidia/vllm
    tag: 26.07-py3
    digest: null  # pin on first `docker pull` of this tag
    platform: linux/arm64
    notes: >
      The old lockfile only ever pinned 26.06-py3
      (sha256:47539d1e9a826506a1ff4536fe507d7688d453c07fe8a2325e96bcc9556b279a). This
      repo moves to 26.07-py3 per docs/CONTRACTS.md §4 and
      docs/legacy/vllm-playbook/{Dockerfile.vllm-26.07-xgrammar-fix,build-vllm.sh,
      start-vllm.sh} — the known-good lineage currently running in production on this
      box. No 26.07-py3 digest exists anywhere in this repo's history yet.
    build:
      dockerfile: compose/images/vllm/Dockerfile
      image_tag: spark-ai/vllm:26.07-xg021
      pins:
        apache-tvm-ffi: "0.1.9"
        xgrammar: "0.2.1"

  llamacpp:
    # Runtime image built from compose/images/llamacpp/Dockerfile — see `sources.llama_cpp`
    # below for the pinned git commit and `builder_base`/`runtime_base` for the CUDA
    # images the Dockerfile builds/runs on.
    builder_base:
      repository: nvidia/cuda
      tag: 13.0.1-devel-ubuntu24.04
      digest: null  # NEEDS-PIN: verify this exact linux/arm64 tag exists before relying on it
      platform: linux/arm64
      notes: >
        Registry access was not available while writing this lockfile. Host driver
        reports CUDA 13.0.3 (see /usr/local/cuda/version.json on this box) — a 13.0.x
        devel image is expected to be compatible but the exact published tag is
        unverified. Confirm the tag resolves, then fill in the digest.
    runtime_base:
      repository: nvidia/cuda
      tag: 13.0.1-runtime-ubuntu24.04
      digest: null  # NEEDS-PIN, same caveat as builder_base
      platform: linux/arm64
    build:
      dockerfile: compose/images/llamacpp/Dockerfile
      image_tag: spark-ai/llamacpp:f9e832c  # short form of sources.llama_cpp.commit
      cmake_flags:
        - -DGGML_CUDA=ON
        - -DGGML_CUDA_F16=ON
        - -DCMAKE_CUDA_ARCHITECTURES=121
        - -DGGML_NATIVE=OFF
        - -DGGML_CUDA_FA=ON
        - -DGGML_CUDA_GRAPHS=ON
        - -DGGML_CPU_REPACK=ON
        - -DGGML_SCHED_MAX_COPIES=4
      notes: >
        -DGGML_CUDA_F16=ON and -DCMAKE_CUDA_ARCHITECTURES=121 are mandated verbatim by
        docs/CONTRACTS.md §4. GGML_CUDA_F16 no longer exists as a cmake option in the
        pinned llama.cpp commit (confirmed against the local ~/llama.cpp-qwen4exp
        checkout on this box, which shares the same ggml-cuda backend code) — cmake
        will warn and ignore it; harmless but worth flagging for a future CONTRACTS.md
        update. CMAKE_CUDA_ARCHITECTURES=121 vs. the "121a-real" that llama.cpp's own
        native-detection logic would choose for this GPU (GB10, sm_121, Blackwell) is
        also a CONTRACTS.md wording note, not a build blocker — see the compose/images
        report for detail. The remaining flags
        (GGML_CUDA_FA/GGML_CUDA_GRAPHS/GGML_CPU_REPACK/GGML_SCHED_MAX_COPIES=4) match
        both ~/llama.cpp-qwen4exp/build/CMakeCache.txt on this box AND the
        ggml/CMakeLists.txt defaults for this llama.cpp version — set explicitly here
        for pinning/clarity rather than because they differ from default.

  sglang:
    repository: lmsysorg/sglang
    tag: spark
    digest: null  # pin on first pull — never pulled/verified from this repo's stack yet
    platform: linux/arm64
    notes: experimental-tier backend per docs/CONTRACTS.md §4/§7. See compose/images/sglang/README.md.

  openwebui:
    repository: ghcr.io/open-webui/open-webui
    tag: main  # NEEDS-PIN: pick a released version tag instead of the moving `main` tag
    digest: null
    platform: linux/arm64

  postgres:
    repository: postgres
    tag: "17"
    digest: null  # pin on first pull (official arm64 multi-arch manifest)
    platform: linux/arm64

  searxng:
    repository: docker.io/searxng/searxng
    tag: 2026.7.3
    digest: sha256:a27984e88335cc72263509cec1173d27e58b63dbf99b438b7faa96c6c306c0c7
    platform: linux/arm64
    notes: carried from the schema-1 lockfile.

sources:
  # Git sources built into images above, or built natively outside compose
  # (config/experimental.yaml's ds4 backend — kept here for continuity since this
  # lockfile is the one place all version pins live, even though ds4 itself is out
  # of workstream C's compose-file scope per docs/CONTRACTS.md §12).
  llama_cpp:
    repository: https://github.com/ggml-org/llama.cpp.git
    ref: b10289
    commit: f9e832c10e9444cb168ddcb579cc62c154f3068b
    notes: >
      Carried from the schema-1 lockfile (still upstream ggml-org, not the local
      ~/llama.cpp-qwen4exp fork on this box, which is an unpublished experimental
      branch with out-of-tree qwen4exp changes and cannot be `git clone`d by the
      Dockerfile). Verify b10289 still configures/builds cleanly before relying on
      it in production; bump to a newer upstream release tag (updating this entry
      and compose/images/llamacpp/Dockerfile's image_tag together) if it doesn't.
  ds4:
    repository: https://github.com/Entrpi/ds4.git
    ref: v0.5.2
    commit: 82d2a6f7ec580d979f8352d3249ad5415a321e89
    notes: >
      Not part of the compose stack (config/experimental.yaml, own systemd unit
      per docs/CONTRACTS.md §7) — carried here unchanged so this repo doesn't lose
      the pin during the schema-1 -> schema-2 lockfile rewrite.

