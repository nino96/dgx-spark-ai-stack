# Experimental model catalog — schema per docs/CONTRACTS.md §7.
# Entries here are NEVER started by the normal compose stack / spark-ai-ctl backend-start
# unless `modelctl activate ... --experimental` is passed explicitly. They are excluded
# from the tested_pairs / concurrency guarantees in config/models.yaml.

schema_version: 2

models:
  deepseek-v4-flash-ds4:
    backend: ds4
    slot: primary
    role: text
    boot: false
    experimental: true
    budget_gib: 100
    source:
      # Same GGUF + drafter as the mainline deepseek-v4-flash llamacpp entry in
      # config/models.yaml, carried from the old config/models.yaml + versions.lock.yaml.
      hf_repo: antirez/deepseek-v4-gguf
      revision: e7f04037032990db0346398d249baf9fb9df1ccc
      filename: DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf
      sha256: ca22ae2f838e14077c22bc1c1417b71b45b5e5a3687bd96c2ac6e17fdb6261c0
      local_path: ~/ai-data/models/gguf/DeepSeek-V4-Flash-IQ2XXS-w2Q2K-AProjQ8-SExpQ8-OutQ8-chat-v2-imatrix-0731.gguf
      drafter:
        hf_repo: bleysg/DeepSeek-V4-Flash-DSpark-drafter-GGUF
        revision: 81c6fdd38f9582da45ba27f0ed7b63bcd3ea3b62
        filename: DSpark-drafter-Q2K-Q8-0731.gguf
        sha256: 8fa269560dc76fd73e4233ad9b1938b5f65dd363381fd9b1a5c6183f7d12d686
        local_path: ~/ai-data/models/gguf/DSpark-drafter-Q2K-Q8-0731.gguf
    served_model_name: deepseek-v4-flash-ds4
    args: []
    health:
      timeout_s: 1800  # ds4 backend default per CONTRACTS.md §9 (wait_healthy timeouts)
    note: >
      Uses the native ds4-server runtime (github.com/Entrpi/ds4, pinned in
      config/versions.lock.yaml), not the llamacpp compose service. Runs as its own
      systemd unit (see docs/legacy/vllm-playbook and the old ansible ds4 role for
      reference), started/stopped outside the docker compose stack.

  qwen3.8-flash-next:
    backend: llamacpp-fork
    slot: secondary
    role: text
    boot: false
    experimental: true
    budget_gib: null  # unknown; not sized/tested yet
    source:
      hf_repo: unsloth/Qwen3.8-Flash-Next-GGUF
      revision: null  # pin at fetch time
    served_model_name: qwen3.8-flash-next
    args: []
    note: >
      Requires a community n-gram-SSD-offload llama.cpp fork (not the pinned mainline
      llama.cpp commit used by compose/images/llamacpp/). Must be natively built on-host
      and run under its own systemd unit — it is never part of the main compose stack and
      is not started via spark-ai-ctl backend-start.
