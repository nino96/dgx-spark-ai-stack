# LiteLLM config TEMPLATE — consumed by `spark-ai-ctl gateway-reload` (root-side,
# per docs/CONTRACTS.md §5). This file itself is never fed to litellm directly.
#
# Render contract (implemented by spark-ai-ctl, NOT by this workstream — this
# header documents the contract the renderer must follow):
#   1. Read /var/lib/spark-ai-stack/active.json for the current active model set
#      (each entry: model-id, backend, slot, served_model_name, host loopback port).
#   2. Read this template.
#   3. For each active model, generate one model_list entry:
#        - model_name: <served_model_name>
#          litellm_params:
#            model: openai/<served_model_name>
#            api_base: http://host.docker.internal:<slot-port>/v1
#            api_key: none
#      (host.docker.internal resolves via the `extra_hosts: host.docker.internal:
#      host-gateway` entry on the litellm service in compose/compose.yml — backend
#      slots are published on the HOST's loopback, not the compose network.)
#   4. ALSO generate one alias entry for the primary slot's active model, so
#      clients that don't know the specific served_model_name can still reach
#      "the current default model":
#        - model_name: local/default
#          litellm_params:
#            model: openai/<served_model_name-of-the-primary-slot-model>
#            api_base: http://host.docker.internal:<primary-slot-port>/v1
#            api_key: none
#   5. Insert the generated entries at the `# {{ACTIVE_MODELS}}` marker below,
#      write the result to /run/spark-ai-stack/litellm-config.yaml (root-owned,
#      0644), and restart/reload the litellm container.
#
# model_list is intentionally EMPTY in this template (see docs/CONTRACTS.md §2.3:
# rendered runtime inputs are authored ONLY by the wrapper, never checked into a
# user-writable file) — a user-writable model_list here could otherwise be used to
# smuggle arbitrary api_base/api_key values into the gateway.

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true       # tolerate backends that reject OpenAI params they don't support
  num_retries: 1
  request_timeout: 1200   # generous: local backends (esp. vLLM cold-load, long-context) are slow
  set_verbose: false

model_list:
  # {{ACTIVE_MODELS}}
  # Entries below this marker are generated by `spark-ai-ctl gateway-reload` from
  # /var/lib/spark-ai-stack/active.json — see the render contract above. Do not
  # hand-edit generated entries; edit config/models.yaml (the source catalog) or
  # this template instead, then re-run `sudo spark-ai-ctl sync && sudo
  # spark-ai-ctl gateway-reload`.
