---
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static:
    # aarch64-hosted runner to match the GB10 target platform (falls back to
    # ubuntu-latest automatically if arm64 hosted runners are unavailable for
    # this repository/org).
    runs-on: ${{ vars.SPARK_AI_CI_RUNNER || 'ubuntu-24.04-arm' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml shellcheck
          python -m pip install yamllint==1.35.1
      - name: Validate repository (static checks + unit tests)
        run: tests/static.sh
